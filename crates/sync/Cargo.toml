[package]
name = "shellwick-sync"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Shellwick sync file: per-item last-writer-wins merge and passphrase encryption (no UI, no network)"

[dependencies]
# All already in the lockfile, same versions. Default features off: random bytes
# come from getrandom directly, so no extra feature pulls anything new in.
argon2 = { version = "0.6", default-features = false, features = ["alloc"] }
aes-gcm = { version = "0.11", default-features = false, features = ["aes", "alloc"] }
getrandom = { version = "0.4", features = ["sys_rng"] }
base64 = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
